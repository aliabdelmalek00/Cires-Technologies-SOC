- hosts: master1
  become: yes
  vars:
    kube_config_path: "/home/{{ ansible_user }}/.kube/config"
  tasks:
    - name: Create an empty kubeadm config if not exists
      copy:
        content: ""
        dest: /etc/kubernetes/kubeadm-config.yaml
        force: no

    - name: Configure container runtime and cluster
      blockinfile:
        path: /etc/kubernetes/kubeadm-config.yaml
        block: |
          kind: ClusterConfiguration
          apiVersion: kubeadm.k8s.io/v1beta3
          controlPlaneEndpoint: "10.10.2.9:6443"
          networking:
            podSubnet: "10.244.0.0/16"
          imageRepository: registry.k8s.io
          ---
          kind: KubeletConfiguration
          apiVersion: kubelet.config.k8s.io/v1beta1
          runtimeRequestTimeout: "15m"
          cgroupDriver: "systemd"
          systemReserved:
            cpu: 100m
            memory: 350M
          kubeReserved:
            cpu: 100m
            memory: 50M
          enforceNodeAllocatable:
          - pods
          sandboxImage: "registry.k8s.io/pause:3.9"

    - name: Initialize cluster on master1
      shell: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: cluster_initialized.log
      register: init_output

    - name: Wait for Kubernetes API server to be ready
      shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
      register: api_ready
      retries: 10
      delay: 15
      until: api_ready.rc == 0

    - name: Extract join commands
      set_fact:
        cp_join_command: "{{ init_output.stdout | regex_search('kubeadm join .*--control-plane --certificate-key [a-f0-9]+', '\\0') }}"
        worker_join_command: "{{ init_output.stdout | regex_search('kubeadm join .*', '\\0') }}"
      run_once: true

    - name: Make join commands available to all hosts
      add_host:
        name: join_commands
        cp_join_command: "{{ cp_join_command }}"
        worker_join_command: "{{ worker_join_command }}"
      run_once: true

    - name: Create .kube directory
      become_user: "{{ ansible_user }}"
      file:
        path: "{{ kube_config_path | dirname }}"
        state: directory
        mode: 0755

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kube_config_path }}"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: 0644

    - name: Install Pod Network (Flannel)
      become_user: "{{ ansible_user }}"
      shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: pod_network_setup.log

- hosts: master2:master3
  become: yes
  tasks:
    - name: Wait for master1 API to be ready
      wait_for:
        host: "{{ hostvars['master1'].ansible_host }}"
        port: 6443
        timeout: 180

    - name: Join master node to cluster as control-plane
      shell: "{{ hostvars['join_commands'].cp_join_command }}"
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: node_joined.log

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: 0644

- hosts: workers
  become: yes
  tasks:
    - name: Wait for master1 API to be ready
      wait_for:
        host: "{{ hostvars['master1'].ansible_host }}"
        port: 6443
        timeout: 180

    - name: Join worker node to cluster
      shell: "{{ hostvars['join_commands'].worker_join_command }}"
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: node_joined.log
