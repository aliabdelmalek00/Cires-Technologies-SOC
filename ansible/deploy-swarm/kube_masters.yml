- hosts: master
  become: yes
  vars:
    kube_config_path: "/home/{{ ansible_user }}/.kube/config"

  tasks:
    - name: Create an empty kubeadm config if not exists
      copy:
        content: ""
        dest: /etc/kubernetes/kubeadm-config.yaml
        force: no

    - name: Configure container runtime and cluster
      blockinfile:
        path: /etc/kubernetes/kubeadm-config.yaml
        block: |
          kind: ClusterConfiguration
          apiVersion: kubeadm.k8s.io/v1beta3
          controlPlaneEndpoint: "10.10.2.9:6443"
          networking:
            podSubnet: "10.244.0.0/16"
          imageRepository: registry.k8s.io
          ---
          kind: KubeletConfiguration
          apiVersion: kubelet.config.k8s.io/v1beta1
          runtimeRequestTimeout: "15m"
          cgroupDriver: "systemd"
          systemReserved:
            cpu: 100m
            memory: 350M
          kubeReserved:
            cpu: 100m
            memory: 50M
          enforceNodeAllocatable:
          - pods
          sandboxImage: "registry.k8s.io/pause:3.9"

    - name: Initialize cluster on master1
      shell: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: cluster_initialized.log
      when: inventory_hostname == 'master1'
      register: init_output

    - name: Wait for Kubernetes API server to be ready
      shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
      register: api_ready
      retries: 10
      delay: 15
      until: api_ready.rc == 0
      when: inventory_hostname == 'master1'

    - name: Retrieve control-plane join command with certificate key
      shell: kubeadm token create --print-join-command --certificate-key $(kubeadm init phase upload-certs --upload-certs | grep 'Using certificate key' | awk '{print $4}')
      register: cp_join_cmd
      changed_when: false
      when: inventory_hostname == 'master1'

    - name: Retrieve worker join command
      shell: kubeadm token create --print-join-command
      register: worker_join_cmd
      changed_when: false
      when: inventory_hostname == 'master1'

    - name: Set join commands as facts
      set_fact:
        cp_join_command: "{{ cp_join_cmd.stdout }}"
        worker_join_command: "{{ worker_join_cmd.stdout }}"
      when: inventory_hostname == 'master1'

    - name: Create .kube directory for user
      become_user: "{{ ansible_user }}"
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        mode: 0755

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kube_config_path }}"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: 0644
      when: inventory_hostname == 'master1'

    - name: Install Pod Network (Flannel)
      become_user: "{{ ansible_user }}"
      shell: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: pod_network_setup.log
      when: inventory_hostname == 'master1'

- hosts: master2:master3
  become: yes
  tasks:
    - name: Wait for master1 API to be ready
      wait_for:
        host: "{{ hostvars['master1'].ansible_host }}"
        port: 6443
        timeout: 180

    - name: Join master node to cluster as control-plane
      shell: "{{ hostvars['master1'].cp_join_command }}"
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: node_joined.log

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: 0644

- hosts: workers
  become: yes
  tasks:
    - name: Wait for master1 API to be ready
      wait_for:
        host: "{{ hostvars['master1'].ansible_host }}"
        port: 6443
        timeout: 180

    - name: Join worker node to cluster
      shell: "{{ hostvars['master1'].worker_join_command }}"
      args:
        chdir: "/home/{{ ansible_user }}"
        creates: node_joined.log
